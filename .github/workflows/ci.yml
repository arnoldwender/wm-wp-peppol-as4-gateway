name: CI Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The plugin header requires PHP 8.1.
        php-version: ['8.1', '8.2', '8.3']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          # pdo_sqlite: the standalone suite runs its SQL on SQLite.
          extensions: dom, mbstring, json, openssl, libxml, simplexml, pdo_sqlite, bcmath
          tools: composer

      - name: Run Standalone Test Suite
        run: |
          php tests/test-suite.php

      - name: EN 16931 conformance (official corpus)
        # 1129 cases the European Commission publishes, each declaring its own expectation. Anything
        # under 100 % means a rule of the artefact is translated wrong, not that a document is bad.
        run: php tools/en16931-schematron-conformance.php --corpus=tests/fixtures/en16931-1.3.16 --min=100

      - name: EN 16931 rule table matches the artefact
        # Catches a hand-edited includes/Validation/En16931RuleSet.php and a silently newer release.
        run: php tools/en16931-compile-schematron.php --download --check

      - name: AS4 receipt signing and verification, on fresh keys
        # Generates receipts with a new RSA key and verifies them with the plugin's own code, so an
        # OpenSSL or libxml upgrade that changes canonicalisation is caught instead of passing on the
        # committed fixture bytes.
        run: php tools/make-as4-receipt.php --out="${RUNNER_TEMP}/as4" --self-check

      # `wp i18n make-pot` IS the definition of a fresh catalog in the step below, so wp-cli is a
      # hard requirement there rather than something it shrugs off. Into $HOME/bin, not the
      # workspace: an executable in the repo root would land in the copy the mutation runner makes.
      # No workflow input reaches these commands; the URL is a literal.
      - name: Install WP-CLI
        if: matrix.php-version == '8.3'
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o "$HOME/bin/wp"
          chmod +x "$HOME/bin/wp"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # This catalog was current on 2026-09-20 (203 strings, 204 entries). Fifteen of the fleet's
      # twenty-four were not, and none of them had a check that could notice.
      - name: Translation catalog freshness
        if: matrix.php-version == '8.3'
        run: php tests/test-pot-freshness.php

      - name: Mutation check
        # Each entry of tests/mutations.php undoes one correction; the suite must turn red for every one.
        run: bash tests/run-mutations.sh

      - name: PHPUnit (UBL document structure)
        # PHPUnit 11 needs PHP 8.2. composer.lock is not committed, so composer resolves the newest PHPUnit this PHP runs.
        if: matrix.php-version != '8.1'
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          vendor/bin/phpunit -c phpunit.xml

      - name: Compliance & Security Audit
        run: python3 .github/scripts/security-audit.py

  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.3 with mysqli
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: dom, mbstring, json, openssl, libxml, simplexml, mysqli, pdo_mysql, bcmath

      - name: Verify MySQL 8.0 InnoDB connection and receipt cryptography
        run: |
          php -r '$m = new mysqli("127.0.0.1", "root", "root", "wp_test", 3306); if ($m->connect_errno) { exit(1); } $r = $m->query("SELECT VERSION()")->fetch_row(); echo "MySQL connected: " . $r[0] . PHP_EOL;'
          php tools/make-as4-receipt.php --out="${RUNNER_TEMP}/as4-mysql" --self-check
